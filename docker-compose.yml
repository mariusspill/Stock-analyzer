# The whole stack. Nothing here depends on software installed on the host
# except Docker itself.
#
#   docker compose up -d db      -> database only
#   docker compose up -d app     -> migrations, then the Streamlit frontend
#   docker compose run --rm pipeline python main.py
#
# The venv lives at /opt/venv inside the image, outside /app, so bind-mounting
# the source over /app for live editing cannot shadow the installed packages.

x-app-env: &app-env
  SQL_HOST: db
  SQL_PORT: 3306
  SQL_USER: root
  SQL_DATABASE: stockdb
  SQL_CONNECTION_PW: ${SQL_CONNECTION_PW:?set SQL_CONNECTION_PW in .env}
  FETCH_UNIVERSE: ${FETCH_UNIVERSE:-full}

services:
  db:
    image: mysql:8.0.41
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${SQL_CONNECTION_PW:?set SQL_CONNECTION_PW in .env}
      MYSQL_DATABASE: ${SQL_DATABASE:-stockdb}
    volumes:
      - db_data:/var/lib/mysql
      # Dumps are written by mysqldump *inside* the container straight into this
      # mount. Nothing passes through a host shell, which is how the previous
      # backup ended up UTF-16 encoded and unrestorable.
      - ./backups:/backups
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${SQL_CONNECTION_PW}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Runs to completion, then exits. `app` waits for it to succeed, so the
  # frontend never starts against an un-migrated schema.
  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  app:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *app-env
    volumes:
      - .:/app
    ports:
      - "${APP_HOST_PORT:-8502}:8501"

  # Not started by `up`; invoked on demand:
  #   docker compose run --rm pipeline python main.py
  pipeline:
    build: .
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    volumes:
      - .:/app
    command: ["python", "main.py"]

volumes:
  db_data:
